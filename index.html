<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>GreenTrust AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital@0;1&display=swap">
<style>
/* Layout: sidebar de navigation + colonne principale (barre haute collante, vues interchangeables, panneau de décision latéral dans le dossier). */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface2:#E9EFEB; --paper:#FBFBF7; --line:#D6DFD9; --line2:#C3CFC8;
  --fg:#13221B; --muted:#58695F; --accent:#0B6B4F; --accent-ink:#FFFFFF; --accent-soft:#DCEFE6;
  --good:#17784A; --good-soft:#DDF2E6; --warn:#8F5A0B; --warn-soft:#FBEBCB; --bad:#B3261E; --bad-soft:#FBE1DE;
  --info:#1F5FA8; --info-soft:#DDE9F7; --mute:#58695F; --mute-soft:#E4EAE6; --mark:#FFF0B8;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace; --serif:'IBM Plex Serif',Georgia,serif;
  --shadow:0 1px 2px rgba(19,34,27,.06),0 4px 14px rgba(19,34,27,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1411; --surface:#121D18; --surface2:#1A2822; --paper:#17231E; --line:#25362E; --line2:#32463C;
  --fg:#E5EEE9; --muted:#8EA498; --accent:#3FBF8F; --accent-ink:#06150F; --accent-soft:#12352A;
  --good:#4FD39A; --good-soft:#123628; --warn:#E9B24D; --warn-soft:#3A2C10; --bad:#FF8A80; --bad-soft:#3F1A18;
  --info:#7FB2F0; --info-soft:#14263D; --mute:#8EA498; --mute-soft:#1D2C25; --mark:#4A3F12; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1411; --surface:#121D18; --surface2:#1A2822; --paper:#17231E; --line:#25362E; --line2:#32463C;
  --fg:#E5EEE9; --muted:#8EA498; --accent:#3FBF8F; --accent-ink:#06150F; --accent-soft:#12352A;
  --good:#4FD39A; --good-soft:#123628; --warn:#E9B24D; --warn-soft:#3A2C10; --bad:#FF8A80; --bad-soft:#3F1A18;
  --info:#7FB2F0; --info-soft:#14263D; --mute:#8EA498; --mute-soft:#1D2C25; --mark:#4A3F12; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);gap:16px;max-width:1520px;margin:0 auto;align-items:start}

/* sidebar */
.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 12px;max-height:calc(100vh - 32px);overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand svg{flex:none}
.brand b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;gap:10px;align-items:center;background:none;border:0;padding:9px 10px;border-radius:8px;text-align:left;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .cnt{margin-left:auto;font:500 11px var(--mono);background:var(--surface2);color:var(--muted);padding:1px 7px;border-radius:99px}
.nav button[aria-current="page"] .cnt{background:var(--accent);color:var(--accent-ink)}
.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--muted)}
.conn{display:flex;gap:8px;align-items:flex-start}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;margin-top:5px}
.dot.run{background:var(--info);animation:pulse 1.4s infinite}
.dot.ok{background:var(--good)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:12px;align-items:center;background:var(--bg);padding:2px 0 12px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:40px;max-width:520px}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;height:100%}
.search:focus-within{border-color:var(--accent)}
.tag{font-size:11px;font-weight:500;letter-spacing:.03em;border:1px dashed var(--line2);color:var(--muted);padding:3px 9px;border-radius:99px;white-space:nowrap}
.iconbtn{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.iconbtn:hover{color:var(--fg);border-color:var(--line2)}
.me{display:flex;gap:10px;align-items:center;padding-left:4px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:13px}
.me small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.me b{font-weight:600;line-height:1.2}
.spacer{flex:1}

/* page */
.page{display:flex;flex-direction:column;gap:16px}
.phead{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.phead h1{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.phead p{color:var(--muted);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:14px;font-weight:600;letter-spacing:0}
.card .sub{color:var(--muted);font-size:12px}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.kpi .val{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:14px;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .ft{font-size:12px;color:var(--muted)}
.up{color:var(--good);font-weight:500}.dn{color:var(--bad);font-weight:500}

/* chips, buttons */
.good{--c:var(--good);--cs:var(--good-soft)}.warn{--c:var(--warn);--cs:var(--warn-soft)}.bad{--c:var(--bad);--cs:var(--bad-soft)}.info{--c:var(--info);--cs:var(--info-soft)}.mute{--c:var(--mute);--cs:var(--mute-soft)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--cs);color:var(--c);white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.run i{animation:pulse 1.2s infinite}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;background:var(--surface2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* bars + ring */
.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:3px;transition:width .5s}
.pill{display:inline-flex;align-items:center;gap:8px;min-width:96px}
.pill b{font:600 14px var(--mono);min-width:26px}
.pill .bar{flex:1;min-width:44px}
.ring{position:relative;width:148px;height:148px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .t{stroke:var(--surface2)}
.ring .p{stroke:var(--c);transition:stroke-dasharray .6s}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1}
.ring .c span{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:4px}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr[data-go]{cursor:pointer}
tbody tr[data-go]:hover td{background:var(--surface2)}
tr:last-child td{border-bottom:0}
.co b{display:block;font-weight:600}
.co span{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:500;color:var(--muted)}
.in{height:38px;border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:0 11px;min-width:0;width:100%}
textarea.in{height:auto;padding:9px 11px;resize:vertical;min-height:84px}
.in:focus{border-color:var(--accent);outline:0}

/* lists */
.list{display:flex;flex-direction:column;list-style:none;margin:0;padding:0}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0;padding-bottom:0}.li:first-child{padding-top:0}
.li .grow{flex:1;min-width:0}
.li small{color:var(--muted);display:block}
.feed .li{align-items:flex-start;font-size:13px}
.feed .t{font:11px var(--mono);color:var(--muted);white-space:nowrap}
.feed .new{animation:slide .5s}
.dist{display:flex;flex-direction:column;gap:14px}
.dist .row{display:grid;grid-template-columns:110px 1fr 36px;gap:12px;align-items:center}

/* detail */
.back{align-self:flex-start}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.dmain{display:flex;flex-direction:column;gap:16px;min-width:0}
.aside{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:16px}
.hero{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.hero .dims{flex:1;min-width:240px;display:flex;flex-direction:column;gap:12px}
.dim{display:grid;grid-template-columns:150px 1fr 34px;gap:12px;align-items:center;font-size:13px}
.dim small{color:var(--muted);font-family:var(--mono);font-size:11px;margin-left:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font-weight:500;color:var(--muted);white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.tabs .n{font:500 11px var(--mono);background:var(--bad-soft);color:var(--bad);padding:1px 6px;border-radius:99px;margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface2);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-weight:600;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.rec{display:flex;gap:12px;align-items:flex-start;background:var(--cs);color:var(--fg);border-radius:10px;padding:12px 14px;margin-top:18px;border:1px solid var(--c)}
.rec svg{color:var(--c);flex:none;margin-top:2px}
.proofs{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:16px;align-items:start}
.clist{display:flex;flex-direction:column;gap:8px}
.citem{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.citem:hover{border-color:var(--line2)}
.citem[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.citem .r{display:flex;gap:8px;align-items:center;justify-content:space-between}
.citem p{font-size:13px;line-height:1.4}
.pl{font:500 11px var(--mono);background:var(--surface2);color:var(--muted);padding:1px 6px;border-radius:5px}
.ev{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px}
.ev header{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:9px 12px;background:var(--surface2);font-size:12px}
.ev header b{font-weight:600;font-size:13px}
.paper{background:var(--paper);padding:16px 18px;font:15px/1.65 var(--serif)}
.paper mark{background:var(--cs);color:var(--fg);border-bottom:2px solid var(--c);padding:0 2px;border-radius:2px}
.ev footer{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:9px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.missing{padding:22px;text-align:center;color:var(--muted);background:var(--paper);border:1px dashed var(--line2);border-radius:10px;margin-top:12px}
.why{background:var(--surface2);border-radius:10px;padding:12px 14px;margin-top:12px}
.why b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px;font-weight:500}
.fb{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.wf{display:flex;flex-direction:column;gap:4px}
.wfr{display:grid;grid-template-columns:minmax(120px,1fr) minmax(160px,1.4fr) 52px;gap:12px;align-items:center;font-size:13px;padding:6px 0}
.wfr .nm{min-width:0}
.wfr .nm small{display:block;color:var(--muted);font-size:11px}
.dv{position:relative;height:18px;background:var(--surface2);border-radius:4px}
.dv::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line2)}
.dv i{position:absolute;top:2px;bottom:2px;background:var(--c);border-radius:3px;transition:all .4s}
.wfr .v{font:500 13px var(--mono);text-align:right}
.wfr.tot{border-top:1px solid var(--line2);margin-top:6px;padding-top:12px;font-weight:600}
.sim label{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.sim label:last-of-type{border-bottom:0}
.sim input{margin-top:3px;accent-color:var(--accent)}
.sim small{color:var(--muted);display:block}
.simres{display:flex;align-items:center;gap:14px;background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin-top:10px}
.simres b{font-size:26px;font-weight:600;letter-spacing:-.02em}
.tl{position:relative;display:flex;flex-direction:column;gap:0;padding-left:22px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line2)}
.tle{position:relative;padding:0 0 16px}
.tle::before{content:"";position:absolute;left:-22px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--info)}
.tle.human::before{border-color:var(--accent);background:var(--accent)}
.tle.bad::before{border-color:var(--bad)}
.tle .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tle .hd b{font-weight:600}
.tle .hd span{font:12px var(--mono);color:var(--muted)}
.tle p{margin-top:2px}
.tle .hs{font:11px var(--mono);color:var(--muted);margin-top:3px;word-break:break-all}
.radio{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:13px}
.radio:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio input{margin-top:3px;accent-color:var(--accent)}
.radio .chip{margin-left:auto;font-size:11px;padding:1px 7px}
.steps{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);flex-wrap:wrap}
.steps span{display:inline-flex;gap:5px;align-items:center}
.steps span::before{content:"";width:8px;height:8px;border-radius:50%;border:2px solid var(--line2)}
.steps .d{color:var(--fg)}.steps .d::before{background:var(--good);border-color:var(--good)}
.steps .a{color:var(--fg);font-weight:600}.steps .a::before{border-color:var(--accent)}
.warnline{font-size:12px;color:var(--warn);background:var(--warn-soft);padding:7px 10px;border-radius:8px}
.err{font-size:12px;color:var(--bad)}

/* analysis + agents */
.pipe{display:flex;flex-direction:column;gap:2px}
.ps{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:12px 0}
.ps .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line2);color:var(--muted);font:600 12px var(--mono);background:var(--surface)}
.ps.run .ic{border-color:var(--info);color:var(--info);animation:pulse 1.2s infinite}
.ps.done .ic{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.ps b{display:block;font-weight:600}
.ps small{color:var(--muted)}
.ps .log{margin-top:6px;font:12px/1.6 var(--mono);color:var(--muted)}
.ps .log div::before{content:"› ";color:var(--accent)}
.files label{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.files label:last-child{border-bottom:0}
.files input{accent-color:var(--accent)}
.files small{margin-left:auto;font:12px var(--mono);color:var(--muted)}
.drop{border:1.5px dashed var(--line2);border-radius:10px;padding:16px;text-align:center;color:var(--muted);margin-bottom:6px}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.acard .top2{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.acard .ai{width:36px;height:36px;border-radius:9px;background:var(--info-soft);color:var(--info);display:grid;place-items:center;flex:none}
.acard dl{display:grid;grid-template-columns:1fr auto;gap:6px 10px;margin:12px 0 0;font-size:13px}
.acard dt{color:var(--muted)}.acard dd{margin:0;font:500 13px var(--mono);text-align:right}
.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flow .node{background:var(--surface2);border-radius:9px;padding:8px 12px;font-weight:500;font-size:13px}
.flow .node.h{background:var(--accent-soft);color:var(--accent)}
.flow svg{color:var(--muted)}
.prin{display:flex;flex-direction:column;gap:14px}
.prin .row{display:grid;grid-template-columns:150px 1fr 44px;gap:12px;align-items:center;font-size:13px}
.code{font:12px/1.6 var(--mono);background:var(--surface2);border-radius:8px;padding:2px 7px}
.intg td:first-child{font-weight:600}
.hashok{display:flex;align-items:center;gap:8px}

    const nBad=d.claims.filter(c=>c.s!=="confirmed").length,pages=d.docs.reduce((a,x)=>a+x.pg,0);
    const steps=[[0,"Agent Ingestion",`${d.docs.length} documents ingérés, OCR terminé (${pages} pages)`],[2,"Agent Extraction",`${d.claims.length} engagements ESG extraits et liés à leur page source`]];
    if(!s.run)steps.push([5,"Agent Vérification croisée",`${nBad} incohérence(s) ou lacune(s) détectée(s)`],[7,"Agent Scoring",`ESG Trust Score calculé : ${d.score}/100`],[8,"Agent Explication","Contributions par facteur et sources liées au score générées"]);
    steps.forEach(([m,a,t])=>ev.push({t:new Date(T(s.at).getTime()+m*60000),type:"agent",actor:a,action:t,ref:d.id}));
    if(s.dec){const[ch,by,after,txt]=s.dec;const lab=CHOICES.find(c=>c[0]===ch)[2];d.decision={choice:ch,by,t:new Date(T(s.at).getTime()+after*60000),text:txt,seen:nBad,total:nBad};
      ev.push({t:d.decision.t,type:"human",actor:by,action:`Décision : ${lab} — ${txt}`,ref:d.id})}
    d.upd=ev.filter(e=>e.ref===d.id).reduce((a,e)=>e.t>a?e.t:a,new Date(0));
  });
  ev.sort((a,b)=>a.t-b.t).forEach(e=>pushAudit(e.ref,e.type,e.actor,e.action,e.t));
  [[2,"Agent Scoring","Trust Score recalculé après ajout de pièces",DOSSIERS[2]],[9,"Agent Vérification croisée","Écart détecté entre affirmation et preuve",DOSSIERS[0]],[14,"Agent Extraction","Nouvelles pièces classées",DOSSIERS[7]]].forEach(([m,a,t,d])=>FEED.push({t:T(m),a,txt:t,d,k:a.includes("Vérif")?"bad":"info"}));
}
const byId=id=>DOSSIERS.find(d=>d.id===id);
const anomalies=d=>d.claims.filter(c=>c.s!=="confirmed");
const simSet=d=>S.sim[d.id]||(S.sim[d.id]=new Set());
const simDelta=d=>d.claims.filter(c=>simSet(d).has(c.id)).reduce((a,c)=>a+(4-c.contrib),0);
const shown=d=>Math.max(0,Math.min(100,d.score+simDelta(d)));
const avg=()=>Math.round(DOSSIERS.reduce((a,d)=>a+d.score,0)/DOSSIERS.length*10)/10;

/* ---------- tableau de bord ---------- */
function trendSVG(){
  const labels=["Avr","Mai","Juin","Juil","Août","Sept","Oct","Nov"],data=[58,59,61,62,64,63,65,avg()];
  const w=620,h=230,pl=34,pr=18,pt=16,pb=28,mn=50,mx=80,X=i=>pl+i*(w-pl-pr)/(data.length-1),Y=v=>pt+(mx-v)*(h-pt-pb)/(mx-mn);
  const pts=data.map((v,i)=>[X(i),Y(v)]),line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+` L${X(data.length-1)} ${h-pb} L${X(0)} ${h-pb}Z`,last=pts[pts.length-1];
  const grid=[50,60,70,80].map(v=>`<line x1="${pl}" x2="${w-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${pl-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${v}</text>`).join("");
  const xl=labels.map((l,i)=>`<text x="${X(i)}" y="${h-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${l}</text>`).join("");
  return`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block" role="img" aria-label="Évolution du Trust Score moyen d'avril à novembre"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${pts.slice(0,-1).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>`).join("")}<circle cx="${last[0]}" cy="${last[1]}" r="6" fill="var(--accent)"/><text x="${last[0]-10}" y="${last[1]-12}" text-anchor="end" font-size="13" font-weight="600" fill="var(--fg)" font-family="var(--mono)">${nf(data[data.length-1])}</text>${xl}</svg>`;
}

async function runAnalysis(){
  const token=++S.run;const name=($("#f-name").value||"").trim()||"Entreprise exemple",files=$$(".fchk").filter(x=>x.checked).length;
  if(!files){toast("Sélectionnez au moins un document.");S.run--;return}
  const sec=$("#f-sector").value,city=$("#f-city").value,amt=Math.max(1,+$("#f-amt").value||50);
  $("#runbtn").disabled=true;$("#pdone").innerHTML="";
  const sleep=ms=>new Promise(r=>setTimeout(r,ms)),live=()=>S.run===token&&S.view==="new";
  const r=rng(parseInt(hstr(name),16)),cov=Math.min(92,38+files*9);
  const sub=[Math.round(44+r()*46),Math.round(40+r()*50),Math.round(46+r()*42),cov];
  for(let i=0;i<PSTEPS.length;i++){
    if(!live())return;
    $("#ps"+i).className="ps run";$("#pstate").textContent=`Étape ${i+1} sur ${PSTEPS.length} · ${PSTEPS[i][1]}`;
    for(const l of PSTEPS[i][2]){if(!live())return;$("#pl"+i).insertAdjacentHTML("beforeend",`<div>${esc(l)}</div>`);await sleep(380)}
    $("#ps"+i).className="ps done";$("#ps"+i).querySelector(".ic").textContent="✓";$("#pbar").style.width=((i+1)/PSTEPS.length*100)+"%";
  }
  const d=finalize({id:"GT-"+(1044+DOSSIERS.length-SEEDS.length),name,sector:sec,city,amt,sub,status:"À valider",an:"Salma B.",at:0});
  const nBad=anomalies(d).length,pages=d.docs.reduce((a,x)=>a+x.pg,0);
  DOSSIERS.unshift(d);d.upd=now();
  pushAudit(d.id,"agent","Agent Ingestion",`${files} documents ingérés, OCR terminé (${pages} pages)`);
  pushAudit(d.id,"agent","Agent Extraction",`${d.claims.length} engagements ESG extraits et liés à leur page source`);
  pushAudit(d.id,"agent","Agent Vérification croisée",`${nBad} incohérence(s) ou lacune(s) détectée(s)`);
  pushAudit(d.id,"agent","Agent Scoring",`ESG Trust Score calculé : ${d.score}/100`);
  pushAudit(d.id,"agent","Agent Explication","Contributions par facteur et sources liées au score générées");
  FEED.unshift({t:now(),a:"Agent Scoring",txt:`Trust Score ${d.score}/100 calculé`,d,k:"good"});
  if(!live())return;
  navHTML();$("#pstate").textContent="Analyse terminée";
  $("#pdone").innerHTML=`<div class="simres" style="margin-top:14px">${ring(d.score,false,76)}<div style="flex:1"><b style="font-size:15px">${esc(d.name)} · ${d.score}/100</b><div class="muted" style="font-size:13px">${band(d.score).l} · ${nBad} point(s) à examiner</div></div><button class="btn pri" data-go="dossier-${d.id.toLowerCase()}">Ouvrir le dossier ${ic("arrow",14)}</button></div>`;
  toast("Analyse terminée : dossier "+d.id+" créé.");
}

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g&&!e.target.closest("[data-a]")){e.preventDefault();go(g.dataset.go);return}
  const t=e.target.closest("[data-tab]");if(t){S.tab=t.dataset.tab;renderView();return}
  const cl=e.target.closest("[data-claim]");if(cl&&S.view==="detail"){const d=byId(S.id);S.sel=cl.dataset.claim;S.tab="preuves";(S.viewed[d.id]||(S.viewed[d.id]=new Set())).add(S.sel);renderView();return}
  const bd=e.target.closest("[data-band]");if(bd){S.band=bd.dataset.band;renderView();return}
  const a=e.target.closest("[data-a]");if(!a)return;
  const act=a.dataset.a,d=S.id?byId(S.id):null;
  if(act==="opensrc")toast(`Prototype : ouverture de « ${a.dataset.doc} », page ${a.dataset.pg}, via Salesforce Files.`);
  if(act==="fb"){const c=d.claims.find(x=>x.id===a.dataset.c);d.fb[c.id]=a.dataset.v;pushAudit(d.id,"human","Salma B.",a.dataset.v==="ok"?`Anomalie confirmée : ${c.c}`:`Faux positif signalé : ${c.c}`);renderView();toast("Votre avis est enregistré dans le journal.")}
  if(act==="editdec"){S.edit=d.id;S.draft[d.id]={choice:d.decision.choice,text:d.decision.text};renderView()}
  if(act==="savedec"){
    const dr=S.draft[d.id]||{choice:"",text:""};const err=$("#derr");
    if(!dr.choice){err.textContent="Choisissez une décision.";return}
    if((dr.text||"").trim().length<12){err.textContent="Ajoutez une justification d'au moins 12 caractères.";return}
    const ch=CHOICES.find(c=>c[0]===dr.choice),todo=anomalies(d),seen=todo.filter(c=>(S.viewed[d.id]||new Set()).has(c.id)).length;
    d.status=ch[2];d.decision={choice:dr.choice,by:"Salma B.",t:now(),text:dr.text.trim(),seen,total:todo.length};d.upd=now();
    pushAudit(d.id,"human","Salma B.",`Décision : ${ch[2]} — ${d.decision.text} (sources consultées ${seen}/${todo.length})`);
    delete S.draft[d.id];S.edit=null;renderView();toast("Décision enregistrée et ajoutée au journal d'audit.");
  }
  if(act==="run")runAnalysis();
  if(act==="verify"){S.verify=verifyChain();renderView()}
  if(act==="tamper"){
    if(S.tamper>=0){AUDIT[S.tamper].action=S.orig;S.tamper=-1;S.orig=null}
    else{S.tamper=Math.min(4,AUDIT.length-1);S.orig=AUDIT[S.tamper].action;AUDIT[S.tamper].action+=" (modifié après coup)"}
    S.verify=null;renderView();
  }
});

  if(S.view==="agents")$$("[data-live]").forEach(el=>{const v=+el.dataset.v,k=el.dataset.live[0];const n=k==="n"?v+Math.round(S.ticks*0.6+Math.random()*3):Math.round(v+(Math.random()-.5)*v*.08);el.textContent=k==="n"?n:n+" ms"});
},1500);

/* ---------- démarrage ---------- */
seedAll();
$("#ic-search").innerHTML=ic("search",16);$("#bell").innerHTML=ic("bell",18);
$("#theme").innerHTML=ic(matchMedia("(prefers-color-scheme: dark)").matches?"sun":"moon",18);
apply(location.hash.slice(1));
</script>
